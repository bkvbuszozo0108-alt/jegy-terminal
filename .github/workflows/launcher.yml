name: Launcher APK

on:
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK (előtelepített a runneren)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Build APK
        run: gradle -p launcher assembleRelease --no-daemon
      - name: Rename
        run: cp launcher/app/build/outputs/apk/release/app-release.apk jegyterminal-launcher.apk
      - uses: actions/upload-artifact@v4
        with: { name: jegyterminal-launcher, path: jegyterminal-launcher.apk }
      - name: Publish release (tag "launcher")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher
          name: Jegyterminál launcher APK
          body: "Android launcher app a jegyterminálhoz. Telepítés: töltsd le az APK-t a telefonra, engedélyezd az ismeretlen forrást, telepítsd, majd Home gomb → válaszd a Jegyterminált → Mindig."
          files: jegyterminal-launcher.apk
